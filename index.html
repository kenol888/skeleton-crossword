<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Skeleton">
<meta name="theme-color" content="#e9edf2">
<script>try{var s=JSON.parse(localStorage.getItem('skeleton:settings')||'{}');if(s.theme==='dark')document.documentElement.dataset.theme='dark';}catch(e){}</script>
<title>Skeleton Crossword</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <section id="screen-library" class="screen"></section>
  <section id="screen-import" class="screen" hidden></section>
  <section id="screen-play" class="screen" hidden></section>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="modal-root"></div>
<noscript>This app needs JavaScript.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
